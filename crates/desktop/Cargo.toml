[package]
name = "wh3-mod-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
wh3-core = { path = "../core", features = ["steam"] }
gpui-kit = "0.7"
# Global allocator for the GUI binary; the core library stays allocator-agnostic.
mimalloc3 = "0.1"
serde_json.workspace = true
rust-i18n = "4.2"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
# Renders assets/logo.svg into assets/app.ico (examples/render_icon.rs); GPUI already
# depends on this version.
resvg = { version = "0.48", default-features = false }

[build-dependencies]
# Already in the graph through GPUI's Windows manifest; compiles the icon and version info.
embed-resource = "3"

[lints]
workspace = true

[[test]]
name = "visual"
harness = false
