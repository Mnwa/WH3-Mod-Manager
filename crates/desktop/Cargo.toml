[package]
name = "wh3-mod-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
wh3-core = { path = "../core", features = ["steam"] }
gpui-kit = "0.7"
# Global allocator for the GUI binary; the core library stays allocator-agnostic.
mimalloc3 = { version = "0.1", features = ["secure"] }
serde_json.workspace = true
rust-i18n = "4.2"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }

[lints]
workspace = true

[[test]]
name = "visual"
harness = false
