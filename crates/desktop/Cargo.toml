[package]
name = "wh3-mod-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
wh3-core = { path = "../core", features = ["steam"] }
# GPUI Fast backend: retained scroll layers and faster layout; imports stay `gpui_kit::*`.
gpui-kit = { version = "0.9", features = ["gpui-fast"] }
# Global allocator for the GUI binary; the core library stays allocator-agnostic.
mimalloc3 = "0.1"
serde_json.workspace = true
# Pool for blocking work, resized while the game runs (src/pool.rs).
rayon = "1"
futures-channel = "0.3"

[dev-dependencies]
futures-executor = "0.3"
gpui-kit = { version = "0.9", features = ["gpui-fast", "test-support"] }
# Renders assets/logo.svg into assets/app.ico (examples/render_icon.rs).
resvg = { version = "0.50", default-features = false }

[build-dependencies]
# Already in the graph through GPUI's Windows manifest; compiles the icon and version info.
embed-resource = "3"

[lints]
workspace = true

[[test]]
name = "visual"
harness = false
