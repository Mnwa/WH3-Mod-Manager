[package]
name = "wh3-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
dirs = "7"
rkyv = { version = "=0.8.17", default-features = false, features = ["std", "bytecheck", "little_endian", "unaligned", "pointer_width_32"] }
crc32fast = "1"
regex = "1"
# Pure-Rust decoders for compressed PFH5 entries: Zstandard (also used for the embedded DB
# schema), LZ4 frames and CA's legacy LZMA1 layout.
ruzstd = "0.9"
lz4_flex = { version = "0.14", default-features = false, features = ["frame", "safe-decode", "checked-decode", "std"] }
lzma-rs = "0.3"
# Self-update from GitHub Releases: blocking API on background threads, rustls, SHA256SUMS verification.
# Verifies the steam_api64.dll that self-update refreshes next to the executable.
sha2 = "0.11"
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "checksums"] }

[features]
# Steamworks Workshop worker; only the Windows GUI enables it.
steam = ["dep:steamworks"]

[target.'cfg(windows)'.dependencies]
steamworks = { version = "0.13", optional = true }

[lints]
workspace = true

[[bench]]
name = "catalog"
harness = false
