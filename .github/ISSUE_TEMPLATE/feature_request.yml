name: Feature request
description: Suggest a new feature or an improvement to an existing one.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. You can write in English or Russian.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you suggest
      options:
        - label: I searched the [existing issues](https://github.com/Mnwa/WH3-Mod-Manager/issues?q=is%3Aissue) and found no similar request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you are trying to do and what makes it hard today.
      placeholder: When I switch between campaigns, I have to …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like the manager to behave? Mockups and screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you tried instead, or how other tools handle it.
    validations:
      required: false
  - type: dropdown
    id: original-manager
    attributes:
      label: Does Shazbot's original WH3 Mod Manager have this feature?
      options:
        - "Yes"
        - "No"
        - I don't know
    validations:
      required: false
