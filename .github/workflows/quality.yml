name: Quality and Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: Core tests and formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p wh3-core --all-targets --locked -- -D warnings
      - run: cargo test -p wh3-core --locked
      - run: cargo bench -p wh3-core --bench catalog --locked | tee catalog-benchmark.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-benchmark
          path: catalog-benchmark.txt
          if-no-files-found: error

  windows:
    name: Windows x64 quality and release
    runs-on: windows-2025
    needs: core
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Package executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/wh3-mod-manager.exe dist/
          Copy-Item target/x86_64-pc-windows-msvc/release/wh3-meta.exe dist/
          Copy-Item LICENSE,README.md dist/
          Copy-Item docs/MIGRATION.md,docs/STORAGE.md dist/
          Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
          Compress-Archive -Path dist/* -DestinationPath WH3-Mod-Manager-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WH3-Mod-Manager-windows-x64
          path: |
            WH3-Mod-Manager-windows-x64.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  visual:
    name: macOS UI and virtualization
    runs-on: macos-15
    needs: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-macos
          path: target/visual/*.png
          if-no-files-found: warn
