name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

# Serialize rebuilds of the same published release.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $release = gh release view $env:RELEASE_TAG --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'The GitHub Release must already exist.' }
          if ($release.isDraft) { throw 'Publish the GitHub Release before building its assets.' }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Set package versions from the tag
        run: python .github/scripts/set-release-version.py
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - name: Package executables
        shell: pwsh
        run: ./.github/scripts/package-windows.ps1 -Tag $env:RELEASE_TAG
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: WH3-Mod-Manager-windows-x64
          path: dist/assets/*
          if-no-files-found: error

  publish:
    name: Attach assets to GitHub Release
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WH3-Mod-Manager-windows-x64
          path: assets
      - name: Verify checksums
        working-directory: assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft
          gh release upload "$RELEASE_TAG" assets/* --clobber
