name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: Core tests and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test release versioning
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy -p wh3-core --all-targets --locked -- -D warnings
      - run: cargo test -p wh3-core --locked
      - run: cargo bench -p wh3-core --bench catalog --locked | tee catalog-benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-benchmark
          path: catalog-benchmark.txt
          if-no-files-found: error

  windows:
    name: Windows x64 checks
    runs-on: windows-latest
    needs: core
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy --target x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  visual:
    name: macOS UI and virtualization
    runs-on: macos-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-macos
          path: target/visual/*.png
          if-no-files-found: warn
